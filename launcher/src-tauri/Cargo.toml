[package]
name = "nastyverse-launcher"
version = "0.1.5"
description = "NastyVerse — portable launcher and application host"
edition = "2021"

[[bin]]
name = "NastyVerse-Launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
percent-encoding = "2"
base64 = "0.22"
semver = "1"
minisign-verify = "0.3"
